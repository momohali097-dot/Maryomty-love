<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مريومتي ❤️</title>
    <style>
        :root {
            --primary: #9d0208;
            --bg-gradient: linear-gradient(135deg, #6a040f, #9d0208, #d00000);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #590d22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-gradient);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: var(--text-color);
            position: relative;
            animation: fadeIn 0.8s ease-in-out;
        }
        h2 { margin-bottom: 20px; font-size: 24px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffb3c1;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input[type="password"]:focus {
            border-color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background: #6a040f; }
        .hidden-content { display: none; }
        .photo-frame {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            background: #eee;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .error-msg { color: #d00000; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة الباسورد -->
        <div class="card" id="lock-screen">
            <h2>اكتبي الباسورد يا صغنونتي ❤️</h2>
            <input type="password" id="passcode" placeholder="أدخل الرمز سري...">
            <button onclick="checkPassword()">دخول</button>
            <div class="error-msg" id="error">الباسورد غلط يا حب! جربي تاني 🥺</div>
        </div>

        <!-- محتوى الموقع الأساسي -->
        <div class="card hidden-content" id="main-content">
            <h2>مريومتي ❤️</h2>
            <div class="photo-frame">
                <!-- هنا تم ربط الصورة بالاسم الصحيح مباشرة -->
                <img src="mariomty.jpg" alt="صغنونتي">
            </div>
            <p style="font-size: 18px; font-weight: bold;">أحلى صغنونتي في الدنيا كلها ✨</p>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passcode').value;
            if (pass === '2312') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
